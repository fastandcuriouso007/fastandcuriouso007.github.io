<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synnaptic &mdash; Banc d'essai &middot; Test bench</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:44rem;margin:14vh auto;padding:0 1.5rem;color:#1a1a2e;line-height:1.7}
h1{color:#262669;font-size:2.4rem;margin-bottom:.2rem}
.tag{color:#7043ab;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.85rem}
a{color:#6666c9;text-decoration:none}
a:hover{text-decoration:underline}
.card{border:1px solid #e5e5f0;border-radius:12px;padding:1.2rem 1.4rem;margin:1rem 0}
.card h2{margin:.1rem 0 .3rem;font-size:1.15rem;color:#262669}
.card p{margin:.2rem 0;color:#555;font-size:.95rem}
.lock{color:#8a8aa8;font-size:.85rem}
footer{margin-top:3rem;color:#999;font-size:.85rem}
.lgbtn{background:#262669;color:#fff;border:1px solid #262669;border-radius:8px;padding:.25rem .6rem;font-size:.8rem;font-weight:700;cursor:pointer}
.lgbtn.on{background:#7043ab;border-color:#7043ab}
.tgl{position:fixed;top:14px;right:14px;display:flex;gap:.3rem}
</style>
</head>
<body>
<div class="tgl"><button class="lgbtn on" data-lang="fr" onclick="setLang('fr')">FR</button><button class="lgbtn" data-lang="en" onclick="setLang('en')">EN</button></div>
<p class="tag">Synnaptic</p>
<h1 class="i18n" data-fr="Banc d'essai" data-en="Test bench"></h1>
<p class="i18n" data-fr="Sites et exp&eacute;rimentations h&eacute;berg&eacute;s ici." data-en="Sites and experiments hosted here."></p>
<div class="card">
<h2><a href="https://polemecatech.synnaptic.com/presentation/pe-plus-v1.html">Polemecatech &mdash; <span class="i18n" data-fr="Pr&eacute;sentation PE+ (v1)" data-en="PE+ deck (v1)"></span></a></h2>
<p class="i18n" data-fr="Pr&eacute;sentation publique du Parcours Europe+ Mat&eacute;riaux/Batteries" data-en="Public deck of Parcours Europe+ Materials/Batteries"></p>
</div>
<div class="card">
<h2><a href="https://polemecatech.synnaptic.com/">&#128274; <span class="i18n" data-fr="Espace membres PE+ &mdash; decks prot&eacute;g&eacute;s" data-en="PE+ members area &mdash; protected decks"></span></a></h2>
<p><span class="i18n" data-fr="R&eacute;unions, intelligence march&eacute;, rapports de mission" data-en="Meetings, market intelligence, mission reports"></span> <span class="lock i18n" data-fr="(acc&egrave;s r&eacute;serv&eacute; &mdash; mot de passe)" data-en="(restricted &mdash; password)"></span></p>
</div>
<footer><span class="i18n" data-fr="synnaptic.com &mdash; h&eacute;berg&eacute; sur GitHub Pages" data-en="synnaptic.com &mdash; hosted on GitHub Pages"></span></footer>
<script>
function setLang(l){localStorage.setItem('peplus_lang',l);applyLang(l);}
function applyLang(l){
  if(!l)l=localStorage.getItem('peplus_lang')||'fr';
  document.documentElement.lang=l;
  document.querySelectorAll('.i18n').forEach(el=>{var v=el.getAttribute('data-'+l);if(v!==null)el.innerHTML=v;});
  document.querySelectorAll('.lgbtn').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
}
document.addEventListener('DOMContentLoaded',function(){applyLang();});
</script>
</body>
</html>
